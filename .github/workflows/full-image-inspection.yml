name: A5E ImmortalWrt full-image inspection (UNTESTED)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build/**"
      - ".github/workflows/full-image-inspection.yml"
      - "scripts/preserve_bootloader.py"
      - "tests/test_preserve_bootloader.py"
      - ".github/workflows/kernel-validation.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  image-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Check out known-working bootloader reference
        uses: actions/checkout@v4
        with:
          repository: mshshakil4/cubie-a5e-immortalwrt
          ref: reference-files
          path: reference-assets

      - name: Test bootloader preservation helper
        run: |
          set -eu
          python3 -m py_compile scripts/preserve_bootloader.py tests/test_preserve_bootloader.py
          python3 -m unittest discover -s tests -v

      - name: Check out pinned ImmortalWrt source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: 4765b657625ec5bbda74b44400465fe043802b30
          path: immortalwrt

      - name: Reclaim runner disk space for full firmware build
        run: |
          set -eu
          # Remove large preinstalled SDKs and caches not used by this build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          if command -v docker >/dev/null 2>&1; then
            sudo docker system prune --all --force --volumes || true
          fi
          echo "Disk space after cleanup:"
          df -h "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget libelf-dev libzstd-dev device-tree-compiler dosfstools mtools util-linux
          sudo apt-get clean

      - name: Prepare package feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure the exact Cubie A5E device profile
        run: |
          set -eu
          cd immortalwrt
          cat ../build/cubie-a5e-kernel.config >> target/linux/sunxi/cortexa53/config-6.18
          cat > .config <<'EOF'
          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_cortexa53=y
          CONFIG_TARGET_sunxi_cortexa53_DEVICE_radxa_cubie-a5e=y
          EOF
          make defconfig
          grep -E '^CONFIG_TARGET_sunxi=y$|^CONFIG_TARGET_sunxi_cortexa53=y$|^CONFIG_TARGET_sunxi_cortexa53_DEVICE_radxa_cubie-a5e=y$' .config
          grep -E '^CONFIG_(IOMMU_SUPPORT|SUN55I_IOMMU)=y$' target/linux/sunxi/cortexa53/config-6.18
          grep -E '^CONFIG_PACKAGE_(kmod-aic8800-sdio|kmod-nvme|wpad-openssl)=y$' .config || true

      - name: Apply Linux 6.18 sun55i IOMMU callback compatibility fix
        run: |
          set -eu
          DRIVER="immortalwrt/target/linux/sunxi/files/drivers/iommu/sun55i-iommu.c"
          test -f "$DRIVER"
          patch --dry-run -d "$(dirname "$DRIVER")" -p1 < build/patches/950-sun55i-iommu-attach-dev-linux-6.18.patch
          patch -d "$(dirname "$DRIVER")" -p1 < build/patches/950-sun55i-iommu-attach-dev-linux-6.18.patch
          PCIE_DRIVER="immortalwrt/target/linux/sunxi/files/drivers/pci/pcie-sunxi/pcie-sunxi-rc.c"
          test -f "$PCIE_DRIVER"
          grep -q 'MSI_FLAG_PCI_MSIX' "$PCIE_DRIVER"
          git -C immortalwrt diff --check

      - name: Build complete device image (CI inspection only)
        run: |
          set -eu
          cd immortalwrt
          make -j2 V=s

      - name: Inspect image and separate boot assets
        run: |
          set -eu
          mkdir -p output
          IMAGE="$(find immortalwrt/bin/targets/sunxi/cortexa53 -maxdepth 1 -type f -name '*radxa*cubie*a5e*sdcard.img.gz' -print -quit)"
          if [ -z "$IMAGE" ]; then
            echo "Could not find the Radxa Cubie A5E SD-card image" >&2
            find immortalwrt/bin/targets/sunxi/cortexa53 -maxdepth 2 -type f -print || true
            exit 1
          fi
          gzip -t "$IMAGE"
          cp "$IMAGE" output/UNTESTED-radxa-cubie-a5e-sdcard.img.gz
          gzip -dc "$IMAGE" > output/inspection.img
          sfdisk --dump output/inspection.img > output/partition-table.txt
          fdisk -l output/inspection.img > output/fdisk-report.txt
          dd if=output/inspection.img of=output/early-boot-region-after-8KiB.bin bs=1 skip=8192 count=1040384 status=none
          UBOOT="$(find immortalwrt/staging_dir -type f -name 'radxa_cubie-a5e-u-boot-with-spl.bin' -print -quit)"
          BOOTSCR="$(find immortalwrt/staging_dir -type f -name 'radxa_cubie-a5e-boot.scr' -print -quit)"
          if [ -n "$UBOOT" ]; then cp "$UBOOT" output/candidate-u-boot-with-spl.bin; fi
          if [ -n "$BOOTSCR" ]; then cp "$BOOTSCR" output/candidate-boot.scr; fi
          {
            echo "status=UNTESTED - DO NOT FLASH"
            echo "board=Radxa Cubie A5E V1.20"
            echo "ram=1GB owner-reported; U-Boot DRAM parameters are NOT approved"
            echo "upstream_repository=immortalwrt/immortalwrt"
            echo "upstream_commit=4765b657625ec5bbda74b44400465fe043802b30"
            echo "project_commit=$(git rev-parse HEAD)"
            echo "image_source=$IMAGE"
            echo "image_generation=standard sunxi SD image recipe"
            echo "warning=standard image embeds a newly built U-Boot/SPL at byte offset 8192"
            echo "warning=do not write this image to the board until the embedded boot chain is compared with the known-working 1GB image and validated"
            echo "warning=CI success is not hardware boot validation"
            echo "files:"
            sha256sum output/UNTESTED-radxa-cubie-a5e-sdcard.img.gz output/early-boot-region-after-8KiB.bin
            if [ -f output/candidate-u-boot-with-spl.bin ]; then sha256sum output/candidate-u-boot-with-spl.bin; fi
            if [ -f output/candidate-boot.scr ]; then sha256sum output/candidate-boot.scr; fi
          } > output/BUILD-MANIFEST.txt
          python3 scripts/preserve_bootloader.py \
            --image output/inspection.img \
            --bootloader reference-assets/reference/u-boot-sunxi-with-spl.bin \
            --output output/UNTESTED-preserved-bootloader-candidate.img \
            | tee output/PRESERVATION-VALIDATION.txt
          gzip -n -c output/UNTESTED-preserved-bootloader-candidate.img > output/UNTESTED-preserved-bootloader-candidate.img.gz
          sha256sum reference-assets/reference/u-boot-sunxi-with-spl.bin > output/REFERENCE-BOOTLOADER-SHA256.txt
          sha256sum output/UNTESTED-preserved-bootloader-candidate.img.gz > output/PRESERVED-CANDIDATE-SHA256.txt
          cat > output/PRESERVED-CANDIDATE-MANIFEST.txt <<EOF
          status=UNTESTED - DO NOT FLASH
          board=Radxa Cubie A5E V1.20; 1GB RAM owner-reported
          bootloader_source=reference-files/reference/u-boot-sunxi-with-spl.bin
          bootloader_offset=8192
          bootloader_size=896329
          bootloader_sha256=2cc42f955c5d0c5042b307ff67b646aa8d49740e2b0680a411506738b03e73eb
          candidate_image=UNTESTED-preserved-bootloader-candidate.img.gz
          source_image=UNTESTED-radxa-cubie-a5e-sdcard.img.gz
          EOF
          rm -f output/UNTESTED-preserved-bootloader-candidate.img output/inspection.img
          ls -lh output
          cat output/partition-table.txt
          cat output/BUILD-MANIFEST.txt
          cat output/PRESERVED-CANDIDATE-MANIFEST.txt

      - name: Upload untested inspection artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cubie-a5e-UNTESTED-full-image-inspection
          path: output/*
          if-no-files-found: error
          retention-days: 7
